name: Build OpenEMS
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
  
jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: kiancross/checkstyle-annotations-action@v1

      - name: Checkstyle
        run: ./gradlew checkstyleAll --console=colored --warn

      - name: Build all Java packages
        run: ./gradlew build --console=colored --warn

      - name: Resolve OpenEMS bundles
        run: ./gradlew resolve --console=colored --warn

      - name: Validate BackendApp.bndrun
        run: git diff --exit-code io.openems.backend.application/BackendApp.bndrun

      - name: Validate EdgeApp.bndrun
        run: git diff --exit-code io.openems.edge.application/EdgeApp.bndrun

      - name: Generate JaCoCo Code-coverage-report
        run: ./gradlew jacocoTestReport jacocoAggregatedReport

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: java
          token: ${{ secrets.CODECOV_TOKEN }}

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Cache Angular CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/angular
          key: ${{ runner.os }}-angular-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - name: Build OpenEMS UI
        run: |
          cd ui
          npm ci --prefer-offline
          npm run lint
          node_modules/.bin/ng build -c "openems,openems-edge-prod,prod"
          export CHROME_BIN=/usr/bin/google-chrome-stable
          npm run test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: ui
          directory: ./ui/
          token: ${{ secrets.CODECOV_TOKEN }}
